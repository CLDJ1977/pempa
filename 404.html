<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página no encontrada | Asociación PEMPA</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/jpeg" href="/img/logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-cream: #faf6f0;
            --color-earth-dark: #3a2a1a;
            --color-earth: #5e4634;
            --color-gold: #b8945c;
            --color-gold-light: #d4b88a;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-cream);
            color: var(--color-earth-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(184, 148, 92, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(184, 148, 92, 0.08) 0%, transparent 50%);
        }
        .logo {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 3px solid var(--color-gold);
            margin-bottom: 32px;
            object-fit: cover;
        }
        h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(5rem, 15vw, 10rem);
            font-weight: 300;
            line-height: 1;
            color: var(--color-earth-dark);
            margin-bottom: 8px;
            letter-spacing: -0.04em;
        }
        h1 em {
            font-style: italic;
            color: var(--color-gold);
            font-weight: 400;
        }
        h2 {
            font-family: 'Fraunces', serif;
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 400;
            margin-bottom: 16px;
            color: var(--color-earth);
        }
        p {
            font-size: 1.05rem;
            color: var(--color-earth);
            max-width: 460px;
            margin-bottom: 36px;
            line-height: 1.6;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 32px;
            background: var(--color-earth-dark);
            color: white;
            border-radius: 100px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 8px 24px rgba(58, 42, 26, 0.15);
        }
        .btn:hover {
            background: var(--color-gold);
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(58, 42, 26, 0.20);
        }
        footer {
            position: fixed;
            bottom: 16px;
            font-size: 0.8rem;
            color: var(--color-earth);
            opacity: 0.7;
        }
        footer a {
            color: var(--color-gold);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <img src="/img/logo.jpg" alt="Logo PEMPA" class="logo">
    <h1>4<em>0</em>4</h1>
    <h2>Esta página se escapó del corral</h2>
    <p>Parece que el caballo que buscás no está acá. Pero hay muchos otros que sí necesitan tu ayuda.</p>
    <a href="/" class="btn">
        ← Volver al inicio
    </a>
    <footer>
        © Asociación PEMPA · Desarrollado por <a href="https://deltacode.com.ar/" target="_blank" rel="noopener">DeltaCode</a>
    </footer>
</body>
</html>
